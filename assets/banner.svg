<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    .g-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .g-dash { stroke-dasharray: 20 10; animation: dashMove 20s linear infinite; }
    .g-grid { animation: gridPulse 4s ease-in-out infinite; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; letter-spacing: 1px; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; letter-spacing: 0.5px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Dynamic Glowing Background Spheres -->
  <circle cx="200" cy="100" r="220" fill="url(#glow-grad)" class="g-glow" />
  <circle cx="1000" cy="300" r="260" fill="url(#glow-grad)" class="g-glow" style="animation-delay: -3s;" />

  <!-- Cyber Grid Lines (Dynamic Aspect) -->
  <g class="g-grid" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Animated Telemetry / Racing Lines -->
  <path d="M -50 320 Q 300 280 600 350 T 1250 290" fill="none" stroke="url(#line-grad)" stroke-width="3" class="g-dash" />
  <path d="M -50 340 Q 350 360 700 270 T 1250 320" fill="none" stroke="url(#line-grad)" stroke-width="2" class="g-dash" style="animation-duration: 14s;" />

  <!-- Decorative Top / Bottom Accent Bars -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#title-grad)" />
  <rect x="0" y="394" width="1200" height="6" fill="url(#title-grad)" />

  <!-- Badge Pill background in Header -->
  <rect x="425" y="45" width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <text x="600" y="66" fill="#38bdf8" class="subtitle-text" font-size="14" text-anchor="middle">🏎️ REINFORCEMENT LEARNING ECOSYSTEM</text>

  <!-- Foreground Title (Guaranteed clear visibility & no overlap) -->
  <g filter="url(#shadow)">
    <text x="600" y="170" fill="url(#title-grad)" class="title-text" font-size="52" text-anchor="middle">
      Awesome RL Autonomous Racing
    </text>

    <!-- Foreground Subtitle -->
    <text x="600" y="225" fill="#f8fafc" class="subtitle-text" font-size="22" text-anchor="middle">
      Curated List of SaaS Platforms, RL Driving Simulators &amp; DIY Autonomous Systems
    </text>

    <!-- Sub-tagline -->
    <text x="600" y="265" fill="#94a3b8" class="subtitle-text" font-size="16" text-anchor="middle">
      Simulators • AWS DeepRacer • CARLA • F1TENTH • Unity ML-Agents • Autonomous Driving AI
    </text>
  </g>

  <!-- Interactive Decorative Dots/Pills -->
  <g fill="#38bdf8">
    <circle cx="100" cy="200" r="4" opacity="0.8" />
    <circle cx="1100" cy="200" r="4" opacity="0.8" />
    <circle cx="150" cy="140" r="3" opacity="0.6" />
    <circle cx="1050" cy="260" r="3" opacity="0.6" />
  </g>
</svg>
